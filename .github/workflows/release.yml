name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  publish:
    name: npm and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve the merged release pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          pull_requests_file="${RUNNER_TEMP}/associated-pull-requests.json"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${MERGE_COMMIT}/pulls" \
            > "$pull_requests_file"

          PULL_REQUESTS_FILE="$pull_requests_file" node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const pullRequests = JSON.parse(readFileSync(process.env.PULL_REQUESTS_FILE, 'utf8'));
          const releasePullRequest = pullRequests.find(
            (pullRequest) =>
              pullRequest.merged_at !== null &&
              pullRequest.base?.ref === 'main' &&
              pullRequest.merge_commit_sha === process.env.MERGE_COMMIT
          );

          if (!releasePullRequest) {
            throw new Error(`Commit ${process.env.MERGE_COMMIT} is not a merged pull request into main.`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `base-branch=${releasePullRequest.base.ref}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `head-branch=${releasePullRequest.head.ref}\n`);
          NODE

      - name: Validate the release branch and package version
        env:
          BASE_BRANCH: ${{ steps.pull-request.outputs.base-branch }}
          HEAD_BRANCH: ${{ steps.pull-request.outputs.head-branch }}
        run: node .github/scripts/validate-release-version.mjs "$BASE_BRANCH" "$HEAD_BRANCH"

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { name, version } = require('./package.json');
          const releaseTag = `v${version}`;
          const prerelease = version.match(/-([0-9A-Za-z-]+)/u);
          const distTag = prerelease?.[1] ?? 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `package-name=${name}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `package-version=${version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release-tag=${releaseTag}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${String(prerelease !== null)}\n`);
          NODE

      - name: Check whether the version is already published
        id: publication
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package-version }}
        run: |
          set +e
          npm_view_output="$(
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json --registry=https://registry.npmjs.org 2>&1
          )"
          npm_view_exit=$?
          set -e

          if [ "$npm_view_exit" -eq 0 ]; then
            echo "Version ${PACKAGE_VERSION} is already published; no release is required."
            echo "publish-needed=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$npm_view_output" | grep -q 'E404'; then
            echo "Version ${PACKAGE_VERSION} is not published and will be released."
            echo "publish-needed=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$npm_view_output" >&2
            exit "$npm_view_exit"
          fi

      - name: Inspect the release tag
        id: tag
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package-version }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            current_commit="$(git rev-parse HEAD)"
            tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            tagged_version="$(
              git show "${RELEASE_TAG}:package.json" |
                node -e 'let source = ""; process.stdin.setEncoding("utf8"); process.stdin.on("data", (chunk) => { source += chunk; }); process.stdin.on("end", () => { process.stdout.write(JSON.parse(source).version); });'
            )"

            if [ "$tagged_version" != "$PACKAGE_VERSION" ]; then
              echo "Release tag ${RELEASE_TAG} contains package version ${tagged_version}." >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$tagged_commit" "$current_commit"; then
              echo "Release tag ${RELEASE_TAG} does not belong to the current main history." >&2
              exit 1
            fi

            echo "Release tag ${RELEASE_TAG} points to verified commit ${tagged_commit}."
            echo "tag-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag ${RELEASE_TAG} does not exist."
            echo "tag-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tagged release source
        if: steps.publication.outputs.publish-needed == 'true' && steps.tag.outputs.tag-exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: git checkout --detach "$RELEASE_TAG"

      - name: Install pinned release tools
        if: steps.publication.outputs.publish-needed == 'true'
        run: npm install --global npm@11.17.0 yarn@1.22.22

      - name: Install exact dependencies
        if: steps.publication.outputs.publish-needed == 'true'
        run: yarn install --frozen-lockfile

      - name: Run the full quality gate
        if: steps.publication.outputs.publish-needed == 'true'
        run: yarn run check

      - name: Create the release tag
        if: steps.publication.outputs.publish-needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        shell: bash
        run: |
          if [ "${{ steps.tag.outputs.tag-exists }}" = "true" ]; then
            echo "Release tag ${RELEASE_TAG} already exists."
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$RELEASE_TAG" --message "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish to npm
        if: steps.publication.outputs.publish-needed == 'true'
        run: npm publish --access public --tag "${{ steps.release.outputs.dist-tag }}"

      - name: Create stable GitHub release
        if: (steps.publication.outputs.publish-needed == 'true' || steps.tag.outputs.tag-exists == 'true') && steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG" --verify-tag

      - name: Create prerelease on GitHub
        if: (steps.publication.outputs.publish-needed == 'true' || steps.tag.outputs.tag-exists == 'true') && steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --generate-notes --prerelease --title "$RELEASE_TAG" --verify-tag
