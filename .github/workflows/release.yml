name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: npm and GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned release tools
        run: npm install --global npm@11.17.0 yarn@1.22.22

      - name: Install exact dependencies
        run: yarn install --frozen-lockfile

      - name: Validate tag and select npm dist-tag
        id: release
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const { version } = require('./package.json');
          const expectedTag = `v${version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected release tag ${expectedTag}; received ${process.env.GITHUB_REF_NAME}.`);
          }
          const prerelease = version.match(/-([0-9A-Za-z-]+)/u);
          const distTag = prerelease?.[1] ?? 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${String(prerelease !== null)}\n`);
          NODE

      - name: Run the full quality gate
        run: yarn run check

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.release.outputs.dist-tag }}"

      - name: Create stable GitHub release
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag

      - name: Create prerelease on GitHub
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease --title "$GITHUB_REF_NAME" --verify-tag
